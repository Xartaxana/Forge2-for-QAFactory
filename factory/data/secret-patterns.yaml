{"schema": "secret-patterns/1", "rows": [
  {"id": "env-file", "kind": "path_glob", "pattern": ".env*", "what": "frozen package guard_secrets.py default: env files (.env, .env.*)"},
  {"id": "credentials-file", "kind": "path_glob", "pattern": "credentials", "what": "frozen package guard_secrets.py default: credentials file"},
  {"id": "credentials-ext", "kind": "path_glob", "pattern": "credentials.[jyit]*", "what": "frozen package guard_secrets.py default: credentials file with an extension"},
  {"id": "secret-file", "kind": "path_glob", "pattern": "secret.[jyt]*", "what": "frozen package guard_secrets.py default: secret data file"},
  {"id": "secrets-file", "kind": "path_glob", "pattern": "secrets.[jyt]*", "what": "frozen package guard_secrets.py default: secrets data file"},
  {"id": "pem-file", "kind": "path_glob", "pattern": "*.pem", "what": "frozen package guard_secrets.py default: PEM file"},
  {"id": "ssh-key-file", "kind": "path_glob", "pattern": "id_rsa*", "what": "frozen package guard_secrets.py default: ssh private key file"},
  {"id": "private-key-header", "kind": "token_regex", "pattern": "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----", "what": "frozen package guard_secrets.py default: private key header"},
  {"id": "key-assignment", "kind": "token_regex", "pattern": "(?i)(api[_-]?key|secret[_-]?key|access[_-]?token|password)\\s*[=:]\\s*['\"][A-Za-z0-9+/_\\-]{16,}['\"]", "what": "frozen package guard_secrets.py default: key or token assignment of a long literal"},
  {"id": "aws-secret-name", "kind": "token_regex", "pattern": "(?i)aws_secret_access_ke[y]", "what": "frozen package guard_secrets.py default: AWS secret key variable name"},
  {"id": "jwt", "kind": "token_regex", "pattern": "eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.", "what": "frozen package guard_secrets.py default: JSON web token"},
  {"id": "aws-key-id", "kind": "token_regex", "pattern": "AKIA[0-9A-Z]{16}", "what": "AWS access key id prefix"},
  {"id": "github-token", "kind": "token_regex", "pattern": "gh[pousr]_[A-Za-z0-9]{30,}", "what": "GitHub token prefix (ghp_, gho_, ghu_, ghs_, ghr_)"},
  {"id": "github-pat", "kind": "token_regex", "pattern": "github_pat_[A-Za-z0-9_]{22,}", "what": "GitHub fine-grained token prefix"},
  {"id": "anthropic-key", "kind": "token_regex", "pattern": "sk-ant-[A-Za-z0-9_-]{20,}", "what": "Anthropic API key prefix"},
  {"id": "slack-token", "kind": "token_regex", "pattern": "xox[abprs]-[A-Za-z0-9-]{10,}", "what": "Slack token prefix"}
]}
