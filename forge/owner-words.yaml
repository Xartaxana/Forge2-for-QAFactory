  {"id": "W-212", "kind": "word", "date": "2026-11-27", "scope": "factory", "scope_by": "owner", "asked": "What should the factory help with, and how should it handle other project work explicitly requested by the person?", "carrier": "Codex chat with the owner, follow-up to the factory requirements comparison, 27.11.2026", "words": "Фабрика должна помогать выполнять хорошее тестирование и не мешать делать всё остальное.", "executed_in": ["forge/specs/20261125-forge2-light-factory-plan.md (27.11.2026 — граница фабрики и работы агента, P1 и P13)"]},
  {"id": "W-213", "kind": "word", "date": "2026-11-27", "scope": "factory", "scope_by": "owner", "asked": "How should the factory handle an unfamiliar request, which hard restrictions apply to the agent, and who can authorize a stage gate exception?", "carrier": "Codex chat with the owner, annotation to the factory documentation audit, 27.11.2026", "words": "Это и была ошибка первой фабрики и от неё мы должны защититься. Жёсткие ограничения у агента только на потолок времени и токенов. На редактирование чего-то неразрешённого без явного согласия человека. Даже гейты между этапами фабрика должна уметь проходить если человек это скажет (в идеале конечно что бы гейты проверяли такое что всем надо и без этого в следующий никто не пропустит, но если будет какой-то редкий случай, то человек должен иметь возможность пропустить дальше, через ответ дирижёру например)", "executed_in": ["forge/specs/20261125-forge2-light-factory-plan.md (раздел 1г и запись 27.11.2026 — произвольный запрос, потолки и проход по слову человека)"]},
  {"id": "W-214", "kind": "word", "date": "2026-11-28", "scope": "factory", "scope_by": "owner", "asked": "What is a clean control for an important user-facing message that disappears before it can be read?", "carrier": "Codex chat with the owner, annotation to the tester manifesto scenario, 28.11.2026", "words": "нет, неверный контроль. Такое сообщение тоже будет багом. Какая цель такого сообщения если его никто не читает? Если нам и не надо что бы его прочитали, то можно просто записать сообщение в лог. Если что-то показывается, то оно показывается для человека", "executed_in": ["forge/specs/20261125-forge2-light-factory-plan.md (28.11.2026 — проверка манифеста: важное сообщение исчезает через три секунды)"]},
  {"id": "W-215", "kind": "word", "date": "2026-11-28", "scope": "factory", "scope_by": "owner", "asked": "How should we use a manual comparison of the factory instructions with a free agent?", "carrier": "Codex chat with the owner, annotation to the pre-implementation review, 28.11.2026", "words": "Хорошая идея. Надо спланировать как это проверять и можно даже включить в тестирование релизов", "executed_in": ["forge/specs/20261125-forge2-light-factory-plan.md (ручное сравнение со свободным агентом и приёмка релиза)"]},
  {"id": "W-216", "kind": "word", "date": "2026-11-28", "scope": "factory", "scope_by": "owner", "asked": "What should the factory do when the implemented change is smaller or larger than requested?", "carrier": "Codex chat with the owner, annotation to the implementation readiness scenario, 28.11.2026", "words": "да, а самое главное сообщить человеку что изменений меньше чем в требованиях или больше и спросить так и задуманно или нет. Возможно дальше и тестить то не надо, а сразу возвращаем в разработку", "executed_in": ["forge/specs/20261125-forge2-light-factory-plan.md (сверка фактического изменения с задачей до полного тестирования)"]},
  {"id": "W-218", "kind": "word", "date": "2026-11-28", "scope": "factory", "scope_by": "owner", "asked": "How should the factory resume when it cannot confirm an important input is still current?", "carrier": "Codex chat with the owner, annotation to the saved-ticket resumption rule, 28.11.2026", "words": "спрашиваем человека и он подтверждает", "executed_in": ["forge/specs/20261125-forge2-light-factory-plan.md (В3: возобновление из записи стори, вопрос об актуальности)"]},
  {"id": "W-219", "kind": "word", "date": "2026-11-28", "scope": "factory", "scope_by": "owner", "asked": "When may implementation of the new test factory start?", "carrier": "Codex chat with the owner, factory pre-implementation review, 28.11.2026", "words": "Запиши что пока все наши обсуждённые сегодня сценарии не будут проходить в ручную по спекам строить код не начинаем, так как надо будет продумать единое архитектурное решение как добиться универсальности и эффективности в фабрике и только потом начинать её строить, а то будем добавлять заплатками как в прошлый раз", "executed_in": ["forge/specs/20261125-forge2-light-factory-plan.md (Фазы: условие старта кода фабрики)", "forge/specs/reports/20261128-legacy-factory-scenarios.md (условие старта реализации)"]},
  {"id": "W-220", "kind": "word", "date": "2026-11-28", "scope": "factory", "scope_by": "owner", "asked": "What gains should factory craft deliver beyond test design techniques?", "carrier": "Codex chat with the owner, annotation to the legacy-factory scenarios audit, 28.11.2026", "words": "Техники тест дизайна не единственно е что мы добавляем к знаниям агента и что надо проверять. Фабрика должна полнее собирать требование, тщательнее отслеживать что каждое требование реализованно и работает, уметь определять бласт радиус и не только просто грэпом по коду и главное понимать ведут ли все эти части к единой цели запрошеной в стори. А то будет что фабрика проверила что кнопка есть, она нажимается, а то что после нажатия ничего не происходит её устроит, так как в аксептенс критериях не было указанно что что-то должно происходить, но любому человеку понятно что если нажать на кнопку, то должно быть какое-то следствие. Агент должен спросить будет ли в другой стори реализация результата или тут просто что-то не работает, а результат все считали настолько очевидным что просто не прописали в требованиях", "executed_in": ["forge/specs/reports/20261128-legacy-factory-scenarios.md (цель стори, требования и область влияния)"]},
  {"id": "W-221", "kind": "word", "date": "2026-11-28", "scope": "factory", "scope_by": "owner", "asked": "How should we demonstrate improvement in automated test code quality?", "carrier": "Codex chat with the owner, follow-up to the construction prerequisite, 28.11.2026", "words": "И ещё мы должны доказывать что растёт качество написания автотестов: есть параметризация, несколько проверок на тест, мягкие для независимых, правильные для последовательных, правильная структура и т.д.", "executed_in": ["forge/specs/reports/20261128-legacy-factory-scenarios.md (качество кода автотестов)"]},
