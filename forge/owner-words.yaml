  {"id": "W-184", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2162 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Нарисуй мне html страничку с красивыми схемами описывающими нашу фабрику и фордж. Какие этапы у фабрики и какие\n  гейты, какие эвалы и т.д. какие у форджа. Одна вкладка на фабрику и одна на фордж со структурой, основным\n  механизмом и идеей", "executed_in": ["C0-1 forge/specs/20261125-forge2-light-factory-overview.html"], "supersedes": "W-48"},
