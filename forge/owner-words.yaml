  {"id": "W-155", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1936 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет согласованы ли источники требований? Описание, AC, комментарии, макеты и спецификация говорят\n  одно / дополняют друг друга / противоречат. Важная ветка: поздний комментарий явно отменяет старое правило или лишь\n  выглядит как отмена.", "executed_in": [], "open": "plan V7 answer: the stage-1 craft of A31 (a contradiction keeps both quotes and becomes a question) on C2-2's requirements page, not built; executor: A31", "supersedes": "W-58"},
