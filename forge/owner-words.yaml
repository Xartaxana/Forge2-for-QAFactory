  {"id": "W-160", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1950 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика учитывает доступны ли исходные материалы? Тикет, комментарии, вложения, репозитории и документация\n  доступны полностью / доступны частично / человек может открыть доступ / источник заведомо недостижим. Это\n  определяет, что удастся выяснить и какие пробелы останутся.", "executed_in": [], "open": "plan V12 answer: per-source availability, gate row G1.1 of C3-3 (read, or unavailable with attempt), not built; executor: C3-3", "supersedes": "W-63"},
  {"id": "W-161", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1953 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет и запоминает есть ли подходящая среда для проверки? Стенд готов / фабрика может его\n  подготовить / подготовить может только человек / доступна только другая среда. Написать тест и иметь возможность\n  его выполнить — отдельные условия. Например на обычном тестовом стенде нельзя зайти от админа и фабрика должна\n  писать такие тесты, но отдавать человеку и он будет прогонять их на стейдже", "executed_in": [], "open": "plan V13 answer: knowledge keys stand and raise_permission of C3-6 with the stand page of C2-4, not built; executor: C3-6", "supersedes": "W-64"},
  {"id": "W-162", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1957 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет и запоминает есть ли необходимые тестовые данные и как можно их создать? Данные уже\n  подготовлены / их можно создать автоматически / требуется сложная история состояний / нужны данные от человека.\n  Отдельная ветка — проверка должна работать на старых данных после миграции.", "executed_in": [], "open": "plan V14 answer: the stand page of C2-4 (stage 2: stands and test data, F22) with knowledge rows, not built; executor: C2-4", "supersedes": "W-65"},
  {"id": "W-163", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1960 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет одинаково ли поведение во всех поддерживаемых конфигурациях? Одна конфигурация / несколько\n  браузеров, платформ, локалей, версий или тарифов / функциональность включается флагом. Нужно выбрать обоснованную\n  матрицу проверок и явно назвать непроверенные", "executed_in": [], "open": "plan V15 answer: growing knowledge lists and a reasoned matrix; no card names the configuration lists or the matrix (C3-6 keys hold none); executor: lead", "supersedes": "W-66"},
  {"id": "W-164", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1963 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Как проверять внешние интеграции? Есть доступная тестовая система партнёра / доступен только эмулятор / можно\n  проверить лишь свою сторону контракта / интеграция недоступна. Результат проверки с заглушкой имеет свою границу\n  доказанности", "executed_in": [], "open": "plan V16 answer: the mocks card A7 (each side real or substituted, the report's boundary of proof), not built; executor: A7", "supersedes": "W-67"},
  {"id": "W-165", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1969 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Может ли она выбирать что автоматизировать, а что нет на основе основных принципов автоматизации (их можно\n  поставить по умолчанию, но проект может их менять по своему желанию)", "executed_in": [], "open": "plan V17 answer: the automate page of C2-3, not built; executor: C2-3", "supersedes": "W-68"},
  {"id": "W-166", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1971 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Может ли она автоматизировать вообще без ручного прохода? Или один мануальный проход для разведки результата\n  это хорошо и мы хотим так?", "executed_in": [], "open": "plan V18 answer: the stage-2 product look and smoke on the stand page of C2-4 (route row of C3-2), not built; executor: C2-4", "supersedes": "W-69"},
  {"id": "W-167", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1973 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Как фабрика планирует на каком уровне автоматизировать тест кейсы ( АПИ, е2е, компонентные, с параметрами, с\n  несколькими ассёртами (софт или краснеть на первом) в одном кейсе, с моками и т.д.) Если внутри теста несколько\n  ассёртов, то может быть несколько ситуаций: Все проверки выполнены / часть зелёная, часть красная / последующие\n  проверки не достигнуты из-за раннего падения / выполнение остановилось ещё на подготовке. У одного теста может быть\n  смешанный результат по обязательствам.", "executed_in": [], "open": "plan V19 answer: the one level list (C3-1), the levels page (C2-3) and results per obligation green, red, not reached, setup stopped (C4-4), not built; executor: C4-4", "supersedes": "W-70"},
