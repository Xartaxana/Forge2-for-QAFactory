  {"id": "W-151", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1921 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "На фабрику влияет стадии реализация стори? Кода ещё нет — готовим проверки заранее / реализация частичная / код\n  готов / изменение уже развёрнуто. В одной стори разные требования могут находиться на разных стадиях готовности. И\n  стори могут запустить, потом остановить на каком-то этапе, обсудить с аналитиком вопрос или просто требования\n  изменятся и ту же стори снова запускают. Она пойдёт с начала и не будет знать что половину работы уже сделали? Или\n  вообще не будет перечитывать тикет и пойдёт по старым требованиям?", "executed_in": [], "open": "plan V3 answer: per-requirement readiness in the story record (C3-1 readiness, stale, revise) and the test report's readiness section (C3-5); the rerun route is phase 6; not built; executor: C3-1", "supersedes": "W-54"},
