  {"id": "W-145", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2150 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Мы одну их последних разрабатывали идею асемпшенов, то есть ожиданий выведенных из логики приложения. Это\n  сохранилось в новой фабрике? Вообще проверь все большие идеи и скажи мне какие включены, а какие нет и почему.\n  Посмотри так же идеи и фичи из ideal-test-factory. Какие стоит включить, а какие нет и почему?", "executed_in": [], "open": "the ideas check was done by the Architect (plan record 25.11 ~20:15, ideas audit); assumptions went into factory cards (C3-1 assumption rows, C3-8 common_logic), not built; a verdict for every thing of the old factory is the carry ledger B15, carry.py not built; executor: B15", "supersedes": "W-45"},
  {"id": "W-146", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2157 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "В фабрику можно ещё добавить скилл по настройке СI (раз у нас есть скилл по разворачиванию фреймворка и моков с\n  ноля). Не в первую фазу конечно. Скилл должен работать на любых системах (ажура, гитлаб, гитхаб, дженкинс и т.д.)\n  уметь ставить юнит тесты, компонент тесты и смоук после пуша, ререссионные тесты на ночь и по кнопке и т.д. Должен\n  уметь использовать уже существующий CI если пользователю надо будет просто добавить туда новые тесты", "executed_in": [], "open": "the CI setup skill is planned for phase 9 (plan phase table), not carded; executor: lead", "supersedes": "W-47"},
  {"id": "W-147", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2167 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "В базе даров Прометея есть что-то полезное по строительству фабрик? Можем подсмотреть мировые тренды?", "executed_in": [], "open": "answered by the Architect's web and catalog check (plan record 25.11 ~20:15); the step 'world practice, the Prometheus catalog first' is card B10 (the new-idea skill), not built (.claude/skills/ empty on main); executor: B10", "supersedes": "W-50"},
  {"id": "W-148", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2169 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Вопросы ко мне напиши подробнее, с плюсами минусами и примерами.", "executed_in": [], "open": "applied in the plan's question sections of 25.11; no forge 2 rule says a question to her carries pros, cons and examples (CLAUDE.md asks only for a recommendation); executor: lead", "supersedes": "W-51"},
  {"id": "W-149", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1918 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Какие у фабрики флоу для тикета? Какой этап идёт за каким? Какой агент или скилл в каком случае включается?", "executed_in": [], "open": "plan V1 answer: routes and stages as data rows, card C3-2 with the launcher C4-1, not built; executor: C3-2", "supersedes": "W-52"},
