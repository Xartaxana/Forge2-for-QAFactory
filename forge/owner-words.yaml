  {"id": "W-40", "kind": "word", "date": "2026-11-25~03:17", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2094 (25.11.2026 ≈ 03:17 — ход дальше)", "words": "потом как обновишь запускай дизайнера и критика на план. Я ушла\nспать, будут вопросы - отвечу утром", "executed_in": ["forge/COORDINATOR.md::Owner's words and questions (C1-1: owner away -- no blocking question, the work goes on)"], "open": null},
  {"id": "W-41", "kind": "word", "date": "2026-11-25~19:20", "scope": "both", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2139 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Мы это уже обсуждали. Правило для фабрики, а не для форджа Для форджа это важная\n  метрика. Похоже часть выводов из обсуждений остаются в сессии и теряются когда \"все знания в репозитории\" важный\n  принцип форджа", "executed_in": ["forge/tools/words.py::cite_findings (B3: a scope per record; a factory rule is not read as a forge rule)", "forge/COORDINATOR.md::Journal, sessions and retro (C1-1: knowledge lives in repo files; nothing left only in the session)", "forge/carriers.json (B7)"], "open": "price as a forge metric (plan 3.12) is card B4, not built; executor: B4"},
  {"id": "W-42", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2143 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Да это не полный тест план, а наше понимание того что нужно тестировать. Там в\n  текущей фабрики перечень пунктов выведенных нами требований", "executed_in": ["forge/specs/20261125-forge2-light-factory-plan.md::plan 1в (the understanding document with the list of derived requirements)"], "open": "C3-5 (understanding template, gate row D2 of C3-3), not built; executor: C3-5"},
  {"id": "W-43", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2145 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "как теперь будет если например на этапе верификации багов когда аналитик может\n  сам пойти посмотреть что там происходит и не один ли это баг или выполняет короткий эксплуаратори тестинг он выявит\n  новое требование?", "executed_in": [], "open": "plan 1д answer: a requirement written by any stage, card A3, not built; executor: A3"},
  {"id": "W-44", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2148 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "надо ли добавить хук после сжатия который напоминает что смотреть, как у нас в фордже?", "executed_in": ["forge/hooks/session_start.py::compose (B2: what to re-read after a compaction)"], "open": "the factory's own after-compaction reminder is card A18, not built; executor: A18"},
  {"id": "W-45", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2150 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Мы одну их последних разрабатывали идею асемпшенов, то есть ожиданий выведенных из логики приложения. Это\n  сохранилось в новой фабрике? Вообще проверь все большие идеи и скажи мне какие включены, а какие нет и почему.\n  Посмотри так же идеи и фичи из ideal-test-factory. Какие стоит включить, а какие нет и почему?", "executed_in": ["forge/specs/reports/20261125-forge2-ideas-audit.md (every big idea and ideal-test-factory: in or out, and why)", "forge/specs/recon/carry/package-agents.md (B15: the old factory's agents, each with a verdict)"], "open": "the assumptions go into factory cards C3-1 (assumption rows) and C3-8 (common_logic), not built; executor: C3-1"},
  {"id": "W-46", "kind": "word", "date": "2026-11-25~19:20", "scope": "both", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2154 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "У нас должны быть жёсткие заборы на максимум токенов и времени. Иногда агент начинает долго думать или много\n  читать ненужного или вообще лезет код переписывать. В фабрике мы должны обрывать такое и возвращать фабрику в\n  сознание (иначе человек будет вынужден ждать вечность или потратить все лимиты).", "executed_in": ["forge/hooks/budget.py (B5: context size and wall time caps per forge worker launch)", "CLAUDE.md::Worker duties (at a cap warning write what is done; at the cut hand back done and not done)", "forge/COORDINATOR.md::Acceptance (a cut worker's hand-back is taken as done and not done; the rest goes to a fresh worker)"], "open": "the factory's own caps and cut (plan 1г) are card A1, not built; executor: A1"},
  {"id": "W-47", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2157 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "В фабрику можно ещё добавить скилл по настройке СI (раз у нас есть скилл по разворачиванию фреймворка и моков с\n  ноля). Не в первую фазу конечно. Скилл должен работать на любых системах (ажура, гитлаб, гитхаб, дженкинс и т.д.)\n  уметь ставить юнит тесты, компонент тесты и смоук после пуша, ререссионные тесты на ночь и по кнопке и т.д. Должен\n  уметь использовать уже существующий CI если пользователю надо будет просто добавить туда новые тесты", "executed_in": [], "open": "the CI setup skill is planned for phase 9 (plan phase table), not carded; executor: lead"},
  {"id": "W-48", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2162 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Нарисуй мне html страничку с красивыми схемами описывающими нашу фабрику и фордж. Какие этапы у фабрики и какие\n  гейты, какие эвалы и т.д. какие у форджа. Одна вкладка на фабрику и одна на фордж со структурой, основным\n  механизмом и идеей", "executed_in": ["forge/specs/20261125-forge2-light-factory-overview.html (C0-1)"], "open": null},
  {"id": "W-49", "kind": "word", "date": "2026-11-25~19:20", "scope": "forge", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2165 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "В фордже2 должно быть как и тут бут загрузка самой важной информации что бы не пришлось объяснять каждой сессии\n  что мы вообще строим как и зачем", "executed_in": ["forge/BOOT.md::What we build and why (B1)", "forge/hooks/session_start.py::boot_block (B2: the boot page printed at session start)"], "open": null},
  {"id": "W-50", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2167 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "В базе даров Прометея есть что-то полезное по строительству фабрик? Можем подсмотреть мировые тренды?", "executed_in": [".claude/skills/idea-goal/SKILL.md::Workflow (B10: world practice, the Gifts of Prometheus catalogue first)", "forge/specs/reports/20261125-forge2-ideas-audit.md (the catalogue check of 25.11)"], "open": null},
  {"id": "W-51", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2169 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Вопросы ко мне напиши подробнее, с плюсами минусами и примерами.", "executed_in": [".claude/skills/idea-goal/SKILL.md::Document template (questions to the owner: options with pros and cons, a recommendation)"], "open": "no rule makes every question to her carry pros, cons and examples outside a goal document, and none asks for examples; executor: lead"},
  {"id": "W-52", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1918 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Какие у фабрики флоу для тикета? Какой этап идёт за каким? Какой агент или скилл в каком случае включается?", "executed_in": [], "open": "plan V1 answer: routes and stages as data rows, card C3-2 with the launcher C4-1, not built; executor: C3-2"},
  {"id": "W-53", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1919 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Надо ли нам отдельный флоу бага что бы фабрика его воспроизводила, убеждалась что он починен и смотрела где ещё\n  есть похожие места и что фикс мог сломать или недочинить?", "executed_in": [], "open": "plan V2 answer: the bug route is phase 6 (spec traceability 1.9: other routes, phase 6), not carded; executor: lead"},
  {"id": "W-54", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1921 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "На фабрику влияет стадии реализация стори? Кода ещё нет — готовим проверки заранее / реализация частичная / код\n  готов / изменение уже развёрнуто. В одной стори разные требования могут находиться на разных стадиях готовности. И\n  стори могут запустить, потом остановить на каком-то этапе, обсудить с аналитиком вопрос или просто требования\n  изменятся и ту же стори снова запускают. Она пойдёт с начала и не будет знать что половину работы уже сделали? Или\n  вообще не будет перечитывать тикет и пойдёт по старым требованиям?", "executed_in": [], "open": "plan V3 answer: per-requirement readiness in the story record (C3-1 readiness, stale, revise) and the test report's readiness section (C3-5); the rerun route is phase 6; not built; executor: C3-1"},
  {"id": "W-55", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1926 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Каков результат ревью или ответа после вопроса человеку? Всё одобрено / нужны конкретные исправления / изменился\n  сам замысел / часть принимается, часть возвращается / человек просит остановиться. Для каждой ветки нужен понятный\n  объём доработки и повторной проверки.", "executed_in": [], "open": "plan V4 answer: the approve form's outcomes (approved, fixes, partial, intent changed, stop) in C4-3, not built; executor: C4-3"},
  {"id": "W-56", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1932 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Как фабрика вообще выбирает что проверять?", "executed_in": [], "open": "plan V5 answer: the check-selection page of C2-3, not built; executor: C2-3"},
  {"id": "W-57", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1933 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика знает что есть несколько источников ожидаемого поведения? (Из явных требований / из старой системы по\n  условию «сохранить как раньше» / из подтверждённого прецедента /из слов пользователя/ достоверного источника пока\n  нет. При сравнении со старой системой нужно различать сохраняемое поведение и старые ошибки.", "executed_in": [], "open": "plan V6 answer: the expectation-source kinds of C3-8, not built; executor: C3-8"},
  {"id": "W-58", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1936 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет согласованы ли источники требований? Описание, AC, комментарии, макеты и спецификация говорят\n  одно / дополняют друг друга / противоречат. Важная ветка: поздний комментарий явно отменяет старое правило или лишь\n  выглядит как отмена.", "executed_in": [], "open": "plan V7 answer: the stage-1 craft of A31 (a contradiction keeps both quotes and becomes a question) on C2-2's requirements page, not built; executor: A31"},
  {"id": "W-59", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1939 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика допускает что пользователь чего-то не знает? Знает ответ / может выяснить у другого участника / сам не\n  знает / решение ещё не принято. В последних случаях нужно определить, какие независимые проверки продолжаются и что\n  остаётся открытым.", "executed_in": [], "open": "plan V8 answer: question forms with addressee and holds in C4-3, not built; executor: C4-3"},
  {"id": "W-60", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1942 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Есть анализ кода и бласт радиуса?", "executed_in": [], "open": "plan V9 answer: change grounding A8 (world.py hunks, gate row G3.5) with the regression radius on C2-3's page (A32), not built; executor: A8"},
  {"id": "W-61", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1943 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Определяет ли фабрика регрессионные тесты?", "executed_in": [], "open": "plan V10 answer: the regression page of C2-3 (handed over, never run), not built; executor: C2-3"},
  {"id": "W-62", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1947 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Берётся ли в расчёт есть ли основа для автотестов? Есть рабочий фреймворк с принятыми соглашениями / есть\n  заготовка или заброшенный набор / фреймворка нет. Нужно либо встроиться, либо восстановить основу, либо создать её с\n  нуля.", "executed_in": [], "open": "plan V11 answer: the three branches are a knowledge row and onboarding (phase 5) with the bootstrap script (phase 9); no card names the test-framework base (C3-6 has no such key); executor: lead"},
  {"id": "W-63", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1950 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика учитывает доступны ли исходные материалы? Тикет, комментарии, вложения, репозитории и документация\n  доступны полностью / доступны частично / человек может открыть доступ / источник заведомо недостижим. Это\n  определяет, что удастся выяснить и какие пробелы останутся.", "executed_in": [], "open": "plan V12 answer: per-source availability, gate row G1.1 of C3-3 (read, or unavailable with attempt), not built; executor: C3-3"},
  {"id": "W-64", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1953 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет и запоминает есть ли подходящая среда для проверки? Стенд готов / фабрика может его\n  подготовить / подготовить может только человек / доступна только другая среда. Написать тест и иметь возможность\n  его выполнить — отдельные условия. Например на обычном тестовом стенде нельзя зайти от админа и фабрика должна\n  писать такие тесты, но отдавать человеку и он будет прогонять их на стейдже", "executed_in": [], "open": "plan V13 answer: knowledge keys stand and raise_permission of C3-6 with the stand page of C2-4, not built; executor: C3-6"},
  {"id": "W-65", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1957 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет и запоминает есть ли необходимые тестовые данные и как можно их создать? Данные уже\n  подготовлены / их можно создать автоматически / требуется сложная история состояний / нужны данные от человека.\n  Отдельная ветка — проверка должна работать на старых данных после миграции.", "executed_in": [], "open": "plan V14 answer: the stand page of C2-4 (stage 2: stands and test data, F22) with knowledge rows, not built; executor: C2-4"},
  {"id": "W-66", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1960 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет одинаково ли поведение во всех поддерживаемых конфигурациях? Одна конфигурация / несколько\n  браузеров, платформ, локалей, версий или тарифов / функциональность включается флагом. Нужно выбрать обоснованную\n  матрицу проверок и явно назвать непроверенные", "executed_in": [], "open": "plan V15 answer: growing knowledge lists and a reasoned matrix; no card names the configuration lists or the matrix (C3-6 keys hold none); executor: lead"},
  {"id": "W-67", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1963 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Как проверять внешние интеграции? Есть доступная тестовая система партнёра / доступен только эмулятор / можно\n  проверить лишь свою сторону контракта / интеграция недоступна. Результат проверки с заглушкой имеет свою границу\n  доказанности", "executed_in": [], "open": "plan V16 answer: the mocks card A7 (each side real or substituted, the report's boundary of proof), not built; executor: A7"},
  {"id": "W-68", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1969 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Может ли она выбирать что автоматизировать, а что нет на основе основных принципов автоматизации (их можно\n  поставить по умолчанию, но проект может их менять по своему желанию)", "executed_in": [], "open": "plan V17 answer: the automate page of C2-3, not built; executor: C2-3"},
  {"id": "W-69", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1971 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Может ли она автоматизировать вообще без ручного прохода? Или один мануальный проход для разведки результата\n  это хорошо и мы хотим так?", "executed_in": [], "open": "plan V18 answer: the stage-2 product look and smoke on the stand page of C2-4 (route row of C3-2), not built; executor: C2-4"},
  {"id": "W-70", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1973 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Как фабрика планирует на каком уровне автоматизировать тест кейсы ( АПИ, е2е, компонентные, с параметрами, с\n  несколькими ассёртами (софт или краснеть на первом) в одном кейсе, с моками и т.д.) Если внутри теста несколько\n  ассёртов, то может быть несколько ситуаций: Все проверки выполнены / часть зелёная, часть красная / последующие\n  проверки не достигнуты из-за раннего падения / выполнение остановилось ещё на подготовке. У одного теста может быть\n  смешанный результат по обязательствам.", "executed_in": [], "open": "plan V19 answer: the one level list (C3-1), the levels page (C2-3) and results per obligation green, red, not reached, setup stopped (C4-4), not built; executor: C4-4"},
  {"id": "W-71", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1978 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика должна уметь обновить уже существующий тест, например добавить в него ещё один шаг или ещё один\n  ассёрт?", "executed_in": [], "open": "plan V20 answer: the reuse ladder, card A32 (search before adding) on the C2-3 and C2-4 pages, not built; executor: A32"},
  {"id": "W-72", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1980 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Сейчас  фабрика должна учитывать можно ли выполнять проверки независимо. Каждая проверка изолирована / тесты\n  меняют общие данные / важен порядок действий / несколько пользователей работают одновременно. Нужны разные решения\n  для очистки, параллельного запуска и проверки конкурентного поведения.", "executed_in": [], "open": "plan V21 answer: check-selection names whether a check changes shared data and runs alone (C2-3 page, A32 row L10), not built; executor: C2-3"},
  {"id": "W-73", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1983 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика умеет эксплуаратори тестинг, а какой там механизм (чартеры)?", "executed_in": [], "open": "plan V22 answer: the exploration page of C2-4 and the explore launch A24, not built; executor: C2-4"},
  {"id": "W-74", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1987 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Так же надо проверять что означает красный результат? Баг продукта / ошибка автотеста / ошибка кейса или\n  ожидания / проблема среды / проверяется другая версия приложения. От причины зависит исполнитель следующего\n  действия; падение само по себе ещё не определяет виновника.", "executed_in": [], "open": "plan V23 answer: the closed red causes with who acts, red-causes.yaml of C3-3, not built; executor: C3-3"},
  {"id": "W-75", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1990 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Тест стабилен или флаки и как мы их выявляем и чиним? Падает воспроизводимо / результат меняется между\n  повторами / нестабилен только в общем наборе или CI. Причина может быть в тесте, среде или реальной гонке\n  приложения — простого повторного зелёного запуска недостаточно для вывода.", "executed_in": [], "open": "plan V24 answer: the red-analysis page of C2-5 (A26: three isolated reruns before flaky, a named mechanism) with the flaky cause of C3-3, not built; executor: C2-5"},
  {"id": "W-76", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1993 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Критик проверяет что зелёный тест действительно способен обнаружить нарушение? Проверка чувствительна к нужной\n  ошибке / сценарий прошёл мимо проверяемого поведения / assert слишком слабый / ожидание скопировано из\n  реализации/маска *** сравнивается с маской *** и тест зелёный. Это развилка между доказанным покрытием и формальным\n  успехом запуска.", "executed_in": [], "open": "plan V25 answer: the critic's probes and gate row G4.5, card C4-2, not built; executor: C4-2"},
  {"id": "W-77", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1997 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Определяет ли фабрика после тестирования что найденная проблема появилась из-за этой стори? Внесена изменением\n  / существовала раньше / уже известна и зарегистрирована / происхождение установить невозможно. Проверка текущего\n  требования и установление причины появления дефекта — разные задачи.", "executed_in": [], "open": "plan V26 answer: the bug draft's origin field (C3-5, plan V26), not built; executor: C3-5"},
  {"id": "W-78", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2003 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Надо ли создавать скилл коллектора/логи или то что он собирает достаточно для анализа поступающих багов?", "executed_in": [], "open": "plan V27 answer: a small collect skill, planned for phase 8, not carded; executor: lead"},
  {"id": "W-79", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2004 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Есть ли у фабрики метрики её эффективности и как они собираются?", "executed_in": [], "open": "plan V28 answer: the run journal and dashboard of C4-6, not built; executor: C4-6"},
  {"id": "W-80", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2005 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Настраивается ли как проект принимает результаты фабрики? Автотесты передаются через MR / сохраняются локально\n  / кейсы публикуются в TMS / баги заводятся в трекере / выдаются только черновики. Возможность читать систему,\n  возможность писать и разрешение на публикацию — отдельные условия.", "executed_in": [], "open": "plan V29 answer: delivery targets C3-7 (md only) with the C3-6 key accept_target; outward adapters are phase 7; not built; executor: C3-7"},
  {"id": "W-81", "kind": "word", "date": "2026-11-25~20:56", "scope": "forge", "scope_by": "lead", "asked": "the Architect's reading of her words of 25.11 ~03:05 on gate checks", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2224", "words": "фраза \"Проверка без требования — тоже дефект\" была про то что у роли что-то требуют на выходе из фазы, а на входе ей\nпро это не сказали, то это не правильно, такак провоцирует лишний круг", "executed_in": ["forge/calibration.md::check 51 (a requirement discovered only at the report, never told before the work)", "CLAUDE.md::Worker duties (a dispatch with no DoD is returned as questions before any work)"], "open": "the factory side, every exit check stated on the stage page before the work (`## How checked`), is card C2-1, not built; executor: C2-1"},
