  {"id": "W-144", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2143 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Да это не полный тест план, а наше понимание того что нужно тестировать. Там в\n  текущей фабрики перечень пунктов выведенных нами требований", "executed_in": ["forge/specs/20261125-forge2-light-factory-plan.md::plan 1в (the understanding document with the list of derived requirements)"], "open": "C3-5 (understanding template, gate row D2 of C3-3), not built; executor: C3-5", "supersedes": "W-42"},
  {"id": "W-145", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2150 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Мы одну их последних разрабатывали идею асемпшенов, то есть ожиданий выведенных из логики приложения. Это\n  сохранилось в новой фабрике? Вообще проверь все большие идеи и скажи мне какие включены, а какие нет и почему.\n  Посмотри так же идеи и фичи из ideal-test-factory. Какие стоит включить, а какие нет и почему?", "executed_in": ["forge/specs/reports/20261125-forge2-ideas-audit.md (every big idea and ideal-test-factory: in or out, and why)", "forge/specs/recon/carry/package-agents.md (B15: the old factory's agents, each with a verdict)"], "open": "the assumptions go into factory cards C3-1 (assumption rows) and C3-8 (common_logic), not built; executor: C3-1", "supersedes": "W-45"},
  {"id": "W-146", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2157 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "В фабрику можно ещё добавить скилл по настройке СI (раз у нас есть скилл по разворачиванию фреймворка и моков с\n  ноля). Не в первую фазу конечно. Скилл должен работать на любых системах (ажура, гитлаб, гитхаб, дженкинс и т.д.)\n  уметь ставить юнит тесты, компонент тесты и смоук после пуша, ререссионные тесты на ночь и по кнопке и т.д. Должен\n  уметь использовать уже существующий CI если пользователю надо будет просто добавить туда новые тесты", "executed_in": [], "open": "the CI setup skill is planned for phase 9 (plan phase table), not carded; executor: lead", "supersedes": "W-47"},
  {"id": "W-147", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2167 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "В базе даров Прометея есть что-то полезное по строительству фабрик? Можем подсмотреть мировые тренды?", "executed_in": [".claude/skills/idea-goal/SKILL.md::Workflow (B10: world practice, the Gifts of Prometheus catalogue first)", "forge/specs/reports/20261125-forge2-ideas-audit.md (the catalogue check of 25.11)"], "open": null, "supersedes": "W-50"},
  {"id": "W-148", "kind": "word", "date": "2026-11-25~19:20", "scope": "unknown", "scope_by": "lead", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:2169 (25.11.2026 ≈ 19:20 — слова владельца после чтения утреннего отчёта (v1.6; дословно).)", "words": "Вопросы ко мне напиши подробнее, с плюсами минусами и примерами.", "executed_in": [".claude/skills/idea-goal/SKILL.md::Document template (questions to the owner: options with pros and cons, a recommendation)"], "open": "no rule makes every question to her carry pros, cons and examples outside a goal document, and none asks for examples; executor: lead", "supersedes": "W-51"},
  {"id": "W-149", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1918 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Какие у фабрики флоу для тикета? Какой этап идёт за каким? Какой агент или скилл в каком случае включается?", "executed_in": [], "open": "plan V1 answer: routes and stages as data rows, card C3-2 with the launcher C4-1, not built; executor: C3-2", "supersedes": "W-52"},
  {"id": "W-150", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1919 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Надо ли нам отдельный флоу бага что бы фабрика его воспроизводила, убеждалась что он починен и смотрела где ещё\n  есть похожие места и что фикс мог сломать или недочинить?", "executed_in": [], "open": "plan V2 answer: the bug route is phase 6 (spec traceability 1.9: other routes, phase 6), not carded; executor: lead", "supersedes": "W-53"},
  {"id": "W-151", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1921 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "На фабрику влияет стадии реализация стори? Кода ещё нет — готовим проверки заранее / реализация частичная / код\n  готов / изменение уже развёрнуто. В одной стори разные требования могут находиться на разных стадиях готовности. И\n  стори могут запустить, потом остановить на каком-то этапе, обсудить с аналитиком вопрос или просто требования\n  изменятся и ту же стори снова запускают. Она пойдёт с начала и не будет знать что половину работы уже сделали? Или\n  вообще не будет перечитывать тикет и пойдёт по старым требованиям?", "executed_in": [], "open": "plan V3 answer: per-requirement readiness in the story record (C3-1 readiness, stale, revise) and the test report's readiness section (C3-5); the rerun route is phase 6; not built; executor: C3-1", "supersedes": "W-54"},
  {"id": "W-152", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1926 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Каков результат ревью или ответа после вопроса человеку? Всё одобрено / нужны конкретные исправления / изменился\n  сам замысел / часть принимается, часть возвращается / человек просит остановиться. Для каждой ветки нужен понятный\n  объём доработки и повторной проверки.", "executed_in": [], "open": "plan V4 answer: the approve form's outcomes (approved, fixes, partial, intent changed, stop) in C4-3, not built; executor: C4-3", "supersedes": "W-55"},
  {"id": "W-153", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1932 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Как фабрика вообще выбирает что проверять?", "executed_in": [], "open": "plan V5 answer: the check-selection page of C2-3, not built; executor: C2-3", "supersedes": "W-56"},
  {"id": "W-154", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1933 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика знает что есть несколько источников ожидаемого поведения? (Из явных требований / из старой системы по\n  условию «сохранить как раньше» / из подтверждённого прецедента /из слов пользователя/ достоверного источника пока\n  нет. При сравнении со старой системой нужно различать сохраняемое поведение и старые ошибки.", "executed_in": [], "open": "plan V6 answer: the expectation-source kinds of C3-8, not built; executor: C3-8", "supersedes": "W-57"},
  {"id": "W-155", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1936 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет согласованы ли источники требований? Описание, AC, комментарии, макеты и спецификация говорят\n  одно / дополняют друг друга / противоречат. Важная ветка: поздний комментарий явно отменяет старое правило или лишь\n  выглядит как отмена.", "executed_in": [], "open": "plan V7 answer: the stage-1 craft of A31 (a contradiction keeps both quotes and becomes a question) on C2-2's requirements page, not built; executor: A31", "supersedes": "W-58"},
  {"id": "W-156", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1939 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика допускает что пользователь чего-то не знает? Знает ответ / может выяснить у другого участника / сам не\n  знает / решение ещё не принято. В последних случаях нужно определить, какие независимые проверки продолжаются и что\n  остаётся открытым.", "executed_in": [], "open": "plan V8 answer: question forms with addressee and holds in C4-3, not built; executor: C4-3", "supersedes": "W-59"},
