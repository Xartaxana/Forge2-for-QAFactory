  {"id": "W-159", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1947 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Берётся ли в расчёт есть ли основа для автотестов? Есть рабочий фреймворк с принятыми соглашениями / есть\n  заготовка или заброшенный набор / фреймворка нет. Нужно либо встроиться, либо восстановить основу, либо создать её с\n  нуля.", "executed_in": [], "open": "plan V11 answer: the three branches are a knowledge row and onboarding (phase 5) with the bootstrap script (phase 9); no card names the test-framework base (C3-6 has no such key); executor: lead", "supersedes": "W-62"},
  {"id": "W-160", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1950 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика учитывает доступны ли исходные материалы? Тикет, комментарии, вложения, репозитории и документация\n  доступны полностью / доступны частично / человек может открыть доступ / источник заведомо недостижим. Это\n  определяет, что удастся выяснить и какие пробелы останутся.", "executed_in": [], "open": "plan V12 answer: per-source availability, gate row G1.1 of C3-3 (read, or unavailable with attempt), not built; executor: C3-3", "supersedes": "W-63"},
  {"id": "W-161", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1953 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Фабрика проверяет и запоминает есть ли подходящая среда для проверки? Стенд готов / фабрика может его\n  подготовить / подготовить может только человек / доступна только другая среда. Написать тест и иметь возможность\n  его выполнить — отдельные условия. Например на обычном тестовом стенде нельзя зайти от админа и фабрика должна\n  писать такие тесты, но отдавать человеку и он будет прогонять их на стейдже", "executed_in": [], "open": "plan V13 answer: knowledge keys stand and raise_permission of C3-6 with the stand page of C2-4, not built; executor: C3-6", "supersedes": "W-64"},
