  {"id": "W-153", "kind": "word", "date": "2026-11-25~01:57", "scope": "factory", "scope_by": "owner", "asked": "none -- said unasked", "carrier": "forge/specs/20261125-forge2-light-factory-plan.md:1932 (25.11.2026 ≈ 01:57 — вопросы владельца о тест-фабрике)", "words": "Как фабрика вообще выбирает что проверять?", "executed_in": [], "open": "plan V5 answer: the check-selection page of C2-3, not built; executor: C2-3", "supersedes": "W-56"},
