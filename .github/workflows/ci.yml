# card: C1-6 (amended by B8). The job list is forge/ci-jobs.json only: this file names no job.
# all-green is the one required check; it is red when the list step failed, or any matrix job failed,
# was cancelled or was skipped while count is above 0.
name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
      count: ${{ steps.m.outputs.count }}
      nb_line: ${{ steps.m.outputs.nb_line }}
      base: ${{ steps.m.outputs.base }}
      head: ${{ steps.m.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then BASE="$PR_BASE"; HEAD="$PR_HEAD"; else BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"; fi
          python -B forge/tools/ci.py matrix --github-output "$GITHUB_OUTPUT" --base "$BASE" --head "$HEAD" --base-fallback "origin/$DEFAULT_BRANCH" > /dev/null
          python -B forge/tools/ci.py check --base "$BASE" --head "$HEAD" --base-fallback "origin/$DEFAULT_BRANCH"

  matrix:
    needs: list
    if: needs.list.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.include) }}
    name: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          JOB_ID: ${{ matrix.id }}
          BASE: ${{ needs.list.outputs.base }}
          HEAD: ${{ needs.list.outputs.head }}
        run: python -B forge/tools/ci.py --only "$JOB_ID" --base "$BASE" --head "$HEAD"

  all-green:
    needs: [list, matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          LIST_RESULT: ${{ needs.list.result }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
          COUNT: ${{ needs.list.outputs.count }}
          NB_LINE: ${{ needs.list.outputs.nb_line }}
        run: |
          if [ "$LIST_RESULT" != "success" ]; then echo "red: the list step is $LIST_RESULT"; exit 1; fi
          if [ "$COUNT" != "0" ] && [ "$MATRIX_RESULT" != "success" ]; then echo "red: the matrix is $MATRIX_RESULT"; exit 1; fi
          echo "green, $NB_LINE"
